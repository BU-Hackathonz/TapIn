<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Join transition demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=DotGothic16&family=IBM+Plex+Sans:wght@500;600&display=swap">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#ecd9d2;font:500 18px/1.4 "IBM Plex Sans",sans-serif;color:#2b1f23}
.board{background:#111;color:#ffb000;padding:28px 36px;font:400 22px/1.3 "DotGothic16",monospace;text-transform:uppercase;box-shadow:inset 0 6px 0 #DA291C;text-align:center}.board b{display:block;font-size:64px;color:#fff;font-weight:400}
.me{font:800 40px "Bricolage Grotesque",sans-serif}.note{position:fixed;left:16px;bottom:12px;font-size:13px;color:#6a4f55}</style></head>
<body>
<!-- DEMO ONLY. In the real flow the transition replaces the 1.5 s "Got it" wait in phone/claim.html (see landing/transition.js). -->
<div class="board" id="board">Tap your badge on any station now<b id="n">3</b></div>
<div class="me" id="me" hidden>Your page: find your table</div>
<p class="note">Demo: a badge "taps" after 3 seconds, then the transition plays. <a href="?replay" style="color:inherit">Replay</a></p>
<script src="transition.js"></script>
<script>
let n = 3; const el = document.getElementById("n");
const iv = setInterval(async () => { el.textContent = --n; if (n > 0) return; clearInterval(iv);
  document.getElementById("board").hidden = true;
  await TapTransition.play({ name: "Maya" });
  document.getElementById("me").hidden = false; }, 1000);
</script></body></html>
