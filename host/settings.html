<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Room settings · Tap In</title><link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="host-flow.css"></head>
<body>
<main>
  <p class="wm">tap <i>in</i></p>
  <form class="sign" id="f" style="--bar:#ED8B00">
    <h1>Room settings</h1>
    <label for="venue">Place name</label>
    <input id="venue" type="text" maxlength="40" required>
    <label for="tables">Tables on the wall</label>
    <select id="tables"><option value="3">3 tables</option><option value="5">5 tables</option><option value="8">8 tables</option><option value="0">All of them</option></select>
    <p class="hint">Only the leading tables are drawn, so the wall stays calm.</p>
    <label for="marker">Table names</label>
    <select id="marker"><option value="letters">Letters (Table B)</option><option value="numbers">Numbers (Table 2)</option></select>
    <label class="switch"><input id="sound" type="checkbox"> Sound on the wall</label>
    <p class="err" id="err" role="alert"></p>
    <button class="btn go" id="start" type="submit">Start</button>
    <button class="ghost" id="out" type="button">Sign out</button>
  </form>
</main>
<i class="stripe"></i><div class="fade" id="fade"></div>
<script>
const $ = (id) => document.getElementById(id), err = $("err");
(async () => {
  const me = await fetch("/api/host/me").then((r) => r.json()).catch(() => ({}));
  if (!me.signed_in) return location.replace("index.html");
  const s = await fetch("/api/room-settings").then((r) => r.json());
  $("venue").value = s.venue; $("tables").value = String(s.tables); $("marker").value = s.marker; $("sound").checked = s.sound;
})();
$("f").addEventListener("submit", async (e) => {
  e.preventDefault(); err.textContent = ""; $("start").disabled = true;
  const body = { venue: $("venue").value.trim(), tables: +$("tables").value, marker: $("marker").value, sound: $("sound").checked };
  try {
    const r = await fetch("/api/host/settings", { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    if (r.status === 401) return location.replace("index.html");
    if (!r.ok) { err.textContent = "Could not save: check the place name"; $("start").disabled = false; return; }
    $("fade").classList.add("on");                                   // everything fades out quickly, then the wall opens and plays the intro
    setTimeout(() => location.assign("/wall/host.html?start"), 380);
  } catch { err.textContent = "Could not reach the server"; $("start").disabled = false; }
});
$("out").addEventListener("click", async () => { await fetch("/api/host/logout", { method: "POST" }).catch(() => {}); location.replace("index.html"); });
</script></body></html>
