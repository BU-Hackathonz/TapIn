<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where you stand · Tap In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="scene strip"><img src="scene-strip.svg" width="192" height="29" alt=""></div>
<p class="wm wm-solo" role="img" aria-label="Tap In">tap <span class="ii" aria-hidden="true">&#305;<svg class="wifi" viewBox="0 0 24 20" aria-hidden="true"><circle cx="12" cy="16.6" r="2.3"/><path d="M6.6 11.6a7.6 7.6 0 0 1 10.8 0"/><path d="M2.9 7.4a12.8 12.8 0 0 1 18.2 0"/></svg></span>n</p>
<main id="app" class="card">
  <p class="muted">Loading...</p>
</main>
<script>const FAKE = false; // true = hard-coded replies, no server needed. false = the real server.</script>
<script src="/landing/ui-sound.js"></script>
<script>UISound.setup({ ambient: true, toggle: true, corner: "top-right", map: { "#go": "go" } });</script>
<script src="common.js"></script>
<script>
  const id = new URLSearchParams(location.search).get("id") || store.get("tapin_person");
  if (!id) location.replace("index.html");
  const app = document.getElementById("app");
  let busy = false;      // skip a refresh while a switch is being saved
  let lastKey = "";      // only rebuild the page when something changed

  // Tables show as letters with line colors, exactly like the host screen (wall/host.js): table 1 is A, 2 is B...
  const letterOf = n => (n > 0 ? String.fromCharCode(65 + ((n - 1) % 26)) : "?");
  const tableNum = name => +((String(name).match(/\d+/) || [0])[0]);
  const tableName = name => String(name).replace(/\bTable (\d+)\b/gi, (m, n) => "Table " + letterOf(+n));
  const bullet = name => el("span", { class: "bullet " + "robg"[tableNum(name) % 4], "aria-hidden": "true" }, letterOf(tableNum(name)));

  const list = (items, empty) => items.length ? el("ul", { class: "list" }, items) : el("p", { class: "empty" }, empty);

  async function post(path, body) {
    busy = true;
    try {
      const { status } = await api("POST", path, body);
      if (status !== 200) alert("Couldn't save that. Try again.");
    } catch (_) {
      alert("Couldn't reach Tap In. Try again.");
    } finally {
      busy = false;
      lastKey = "";
      refresh();
    }
  }

  function groupsSection(me) {
    return [
      el("h2", {}, "Tables that fit you"),
      list(me.suggested_groups.map((s, i) => el("li", { class: i === 0 ? "top" : "" },
        // "Table 2 needs firmware" reads as a sentence; other reasons get a separator
        el("div", { class: "title" }, bullet(s.group.name), tableName(s.group.name), s.reason.startsWith("needs") ? " " : " · ", el("span", { class: "why" }, s.reason)),
        s.group.working_on ? el("div", {}, doing(s.group.working_on)) : null,
        el("div", { class: "sub" }, `You know ${s.group.known_count} of its ${s.group.size} ${s.group.size === 1 ? "person" : "people"}`),
      )), me.here ? "No open tables fit you right now. Check back soon." : "Check in at a station to see tables that fit you."),
      el("h2", {}, "People to meet"),
      list(me.suggested_people.map(s => el("li", {},
        el("div", { class: "title" }, s.person.name, " · ", el("span", { class: "why" }, s.reason)),
        s.person.skills.length ? el("div", { class: "sub" }, s.person.skills.join(", ")) : null,
      )), "Nobody new to suggest yet."),
    ];
  }

  function needsSection(needs) {
    const open = needs.filter(n => n.handled_by == null);
    const done = needs.filter(n => n.handled_by != null);
    return [
      el("h2", {}, "Tables waiting for help"),
      // Spec: staff see how many needs got met (the server gives no handled time, so no wait for those)
      needs.length ? el("p", { class: "muted" }, `${done.length} of ${needs.length} needs met`) : null,
      list([
        ...open.map((n, i) => el("li", { class: i === 0 ? "top" : "" },
          el("div", { class: "title" }, bullet(n.table), tableName(n.table), " ", el("span", { class: "why" }, "needs " + n.need)),
          el("div", { class: "sub mono" }, "waiting " + ago(n.since)))),
        ...done.map(n => el("li", { class: "handled" },
          el("div", { class: "title" }, bullet(n.table), `${tableName(n.table)} needs ${n.need}`),
          el("div", { class: "sub" }, "handled"))),
      ], "No table is asking for help right now."),
      el("p", { class: "note" }, "Scan in with a table at its station to mark its need handled."),
    ];
  }

  function groupSection(g) {
    if (!g) return [];
    let looking = g.looking_for.slice();
    const lookingBox = chipGroup("group_looking", SKILLS, looking, 2, v => {
      looking = v;
      post(`/groups/${g.id}/mode`, { mode: g.mode, looking_for: looking });
    });
    const modeBtn = (mode, label) => el("button", {
      type: "button", "aria-pressed": String(g.mode === mode),
      onclick: () => g.mode !== mode && post(`/groups/${g.id}/mode`, { mode, looking_for: looking }),
    }, label);
    return [
      el("h2", {}, "Your table"),
      el("p", { class: "yours" }, bullet(g.name), el("strong", {}, tableName(g.name)), el("span", { class: "points" }, `${g.points} pts`)),
      g.working_on ? el("p", { class: "muted" }, doing(g.working_on)) : null,
      el("p", { class: "muted" }, g.members.map(m => m.name).join(", ")),
      el("div", { class: "seg", role: "group", "aria-label": "Table mode" }, modeBtn("open", "Open"), modeBtn("heads_down", "Heads-down")),
      el("p", { class: "note" }, g.mode === "open" ? "Open: we show your table to people who fit." : "Heads-down: nobody gets your table as a suggestion."),
      el("fieldset", {}, el("legend", {}, "Your table is looking for ", el("small", {}, "(up to 2)")), lookingBox),
    ];
  }

  // Edit your profile photo: kept on this device (wall.me.photo), what the room map shows for you. Same as at sign-up.
  function photoEditor() {
    let photo = null;
    try { photo = (JSON.parse(localStorage.getItem("wall.me") || "null") || {}).photo || null; } catch (_) {}
    const img = el("img", { class: "me-photo", alt: "" }); img.hidden = !photo; if (photo) img.src = photo;
    const label = el("span", {}, photo ? "Change photo" : "Add a profile photo");
    const input = el("input", { type: "file", accept: "image/*", onchange: (e) => {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const pic = new Image();
      pic.onload = () => {
        const c = document.createElement("canvas"); c.width = c.height = 128;
        const side = Math.min(pic.width, pic.height);
        c.getContext("2d").drawImage(pic, (pic.width - side) / 2, (pic.height - side) / 2, side, side, 0, 0, 128, 128);
        photo = c.toDataURL("image/jpeg", 0.85); URL.revokeObjectURL(pic.src);
        try { const m = JSON.parse(localStorage.getItem("wall.me") || "null") || {}; localStorage.setItem("wall.me", JSON.stringify({ ...m, photo })); } catch (_) {}
        img.src = photo; img.hidden = false; label.textContent = "Change photo";
      };
      pic.src = URL.createObjectURL(f);
    } });
    return el("div", { class: "photo-row" }, img, el("label", { class: "button secondary photo-btn" }, input, label));
  }

  function render(me, needs) {
    const p = me.person;
    try {   // keep the room map's profile (same site) on this person, so the map never shows a second, stale you
      const prev = JSON.parse(localStorage.getItem("wall.me") || "null") || {};
      if (prev.person_id !== p.id) localStorage.setItem("wall.me", JSON.stringify({ ...prev, person_id: p.id, name: p.name, role: p.role, face: prev.face || `face-${p.id}` }));
    } catch (_) { /* private mode */ }
    const helper = p.role !== "student";
    const state = el("span", { class: "switch-state" + (p.focus ? " on" : ""), "aria-hidden": "true" }, p.focus ? "On" : "Off");
    const focus = el("input", { type: "checkbox", class: "switch", id: "focus", role: "switch", checked: p.focus,
      onchange: e => {
        state.textContent = e.target.checked ? "On" : "Off";
        state.className = "switch-state" + (e.target.checked ? " on" : "");
        post(`/me/${p.id}/focus`, { focus: e.target.checked });
      } });
    app.replaceChildren(
      el("h1", {}, p.name, el("span", { class: "points" }, `${me.points} pts`)),
      el("p", {}, el("span", { class: "status" + (me.here ? " here" : "") }, me.here ? "Here now" : "Not checked in"),
        me.here ? null : el("span", { class: "muted" }, " Tap your badge alone at the Entrance.")),
      // into the room map as yourself: the map reads this browser's profile (wall.me) and shows your links and table
      el("a", { class: "button", href: "/wall/index.html?as=" + encodeURIComponent(p.id) + "&name=" + encodeURIComponent(p.name), onclick: () => { try {
        const prev = JSON.parse(localStorage.getItem("wall.me") || "null") || {};
        localStorage.setItem("wall.me", JSON.stringify({ ...prev, person_id: p.id, name: p.name, role: p.role, skills: p.skills || [], looking_for: p.looking_for || [], working_on: p.working_on || "", face: prev.face || `face-${p.id}` }));
        if (me.here) localStorage.setItem("wall.room", JSON.stringify({ status: "in", name: "This room", time: Date.now() }));
      } catch (_) {} } }, "Open the room map"),
      photoEditor(),
      el("div", { class: "switch-row" },
        el("label", { for: "focus" }, "Focus mode", el("small", {}, "Nobody gets you as a suggestion.")), state, focus),
      el("h2", {}, "People you know who are here"),
      list(me.known_here.map(k => el("li", {}, el("span", { class: "title" }, k.name))), "Nobody you've met is here yet."),
      ...(helper ? needsSection(needs) : groupsSection(me)),
      ...groupSection(me.group),
      el("ol", { class: "journey", "aria-label": "Steps" }, el("li", {}, "Sign up"), el("li", {}, "Tap your badge"), el("li", { "aria-current": "step" }, "Find your table")),
      el("footer", {}, "Not you? ", el("a", { href: "index.html", onclick: () => store.del("tapin_person") }, "Make a new profile")),
    );
  }

  async function refresh() {
    if (busy || document.hidden) return;
    try {
      const r = await api("GET", "/me/" + encodeURIComponent(id));
      if (r.status === 404) {
        store.del("tapin_person");
        app.replaceChildren(el("p", { class: "big" }, "We don't know that profile"),
          el("a", { class: "button", href: "index.html" }, "Make a profile"));
        return;
      }
      if (r.status !== 200) throw new Error();
      const needs = r.data.person.role !== "student" ? (await api("GET", "/needs")).data || [] : [];
      const key = JSON.stringify([r.data, needs]);
      if (key !== lastKey && !busy) { lastKey = key; render(r.data, needs); }
    } catch (_) {
      if (!lastKey) app.replaceChildren(
        el("p", { class: "error" }, "Couldn't reach Tap In. Retrying..."));
    }
  }

  store.set("tapin_person", id);
  refresh();
  setInterval(refresh, 5000);
  document.addEventListener("visibilitychange", refresh);
</script>
</body>
</html>
