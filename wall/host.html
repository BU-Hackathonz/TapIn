<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tap In · Host</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="host.css">
</head>
<body>
<!-- Host screen: the room plan for the wall. Display only: nothing on this page reacts to the mouse, touch or keyboard. -->
<main id="stage">
  <canvas id="room" aria-label="Room plan: who is here and which table they are at"></canvas>
  <header id="brand"><b>Tap In</b><span id="venue"></span></header>
  <p id="conn" class="conn" hidden>Reconnecting…</p>
</main>

<aside id="side" aria-label="Room numbers">
  <p id="statline" class="mono"></p>
  <section>
    <h2>Groups, by points</h2>
    <ol id="groups" class="rows"></ol>
    <p class="note">Groups get double for welcoming someone new.</p>
  </section>
  <section>
    <h2>Needs</h2>
    <ul id="needs" class="rows"></ul>
  </section>
  <section>
    <h2>Activity</h2>
    <ul id="activity" class="log"></ul>
  </section>
  <section class="chart">
    <h2>Scans per 10 min <span>last 2 h</span></h2>
    <div id="bars" class="bars" aria-hidden="true"></div>
  </section>
</aside>

<footer id="moment" aria-live="polite">
  <time id="mtime" class="mono"></time>
  <p id="mtext"></p>
</footer>

<div id="start" class="start">
  <button type="button" id="start-btn">Start</button>
  <p>Click once to turn on sound.</p>
</div>

<script src="vendor/Tone.js"></script>
<script src="vendor/d3-force.min.js"></script>
<script src="sound.js"></script>
<script src="room_layout.js"></script>
<script src="host.js"></script>
</body>
</html>
