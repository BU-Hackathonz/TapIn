<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room map</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="wall.css">
</head>
<body>
<canvas id="map3d" aria-label="3D room view"></canvas>
<aside id="profile" class="profile" aria-label="Profile" hidden>
  <button type="button" id="profile-close" class="profile-close" aria-label="Close profile">×</button>
  <div id="profile-body"></div>
</aside>

<span class="demo-tag">DEMO</span>
<div class="count"><b id="here">0</b><span>here now</span></div>
<div id="conn" class="conn" title="Live connection"></div>
<p id="arrival" class="arrival" aria-live="polite"></p>

<div id="start" class="start">
  <button type="button" id="start-btn">Start</button>
  <p>Click once to turn on sound.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>
<script src="sound.js"></script>
<script src="view3d.js"></script>
<script src="demo.js"></script>
<script src="wall.js"></script>
</body>
</html>
