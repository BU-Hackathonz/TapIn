<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brand mockups</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="../brand.css">
<style>
  body { margin: 0; padding: 32px 24px 60px; background: #f4f2ee; font-family: "IBM Plex Sans", system-ui, sans-serif; color: #1d1d1f; }
  h1 { font-size: 26px; margin: 0 0 4px; } h2 { font-size: 16px; margin: 36px 0 12px; font-family: "IBM Plex Mono", monospace; letter-spacing: .06em; text-transform: uppercase; color: #777; }
  p.note { color: #666; margin: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
  .card { background: #fff; border-radius: 22px; padding: 16px 16px 18px; box-shadow: 0 10px 30px rgba(0,0,0,.06); }
  .card h3 { margin: 14px 4px 2px; font-size: 22px; } .card p { margin: 0 4px; color: #555; font-size: 14px; }
  .tag { display: inline-block; margin: 12px 4px 0; font: 600 11px "IBM Plex Mono", monospace; color: #888; letter-spacing: .06em; text-transform: uppercase; }
  .logos { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .logo-card { background: #fff; border-radius: 18px; padding: 26px 22px; display: flex; flex-direction: column; align-items: flex-start; gap: 14px; min-height: 120px; }
  .logo-card.dark { background: #1d1d1f; } .logo-card.dark .lg { color: #fff; }
  .card .art-wide { height: auto; aspect-ratio: 360 / 220; border-radius: 18px; }
  .pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 20px; }
  .page { background: #fff; border-radius: 18px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.06); }
  .page .frame { width: 100%; aspect-ratio: 16 / 10; overflow: hidden; position: relative; }
  .page iframe { position: absolute; top: 0; left: 0; width: 1440px; height: 900px; border: 0; transform-origin: 0 0; pointer-events: none; }
  .page a { display: block; padding: 10px 14px; font: 600 12px "IBM Plex Mono", monospace; color: #555; text-decoration: none; letter-spacing: .04em; }
</style>
</head>
<body>
<h1>Tap In: illustration and logo mockups</h1>
<p class="note">Flat, colourful people over bold blocks with hand-drawn doodles. The name is the logo (no icon). Pick a scene and a logo layout.</p>

<h2>Illustrations, as the sign-in hero</h2>
<div class="grid" id="scenes"></div>

<h2>Logo layouts</h2>
<div class="logos" id="logos"></div>

<h2>Front page layouts (live, scaled down)</h2>
<div class="pages" id="pages"></div>

<script src="../art.js"></script>
<script>
  const names = { trio: "A · Trio over blocks", tap: "B · The tap moment", circle: "C · Faces in circles", table: "D · Around a table", kiosk: "E · Tap at the kiosk (front page)" };
  for (const [k, fn] of Object.entries(TapArt.scenes)) {
    const c = document.createElement("div");
    c.className = "card";
    c.innerHTML = fn() + '<span class="tag">' + names[k] + '</span><h3>Find your people</h3><p>Sign in, tell us what you\'re good at, and the room shows you which table needs you.</p>';
    document.getElementById("scenes").append(c);
  }
  const lnames = { classic: "1 · Classic", twotone: "2 · Two-tone", dot: "3 · Lowercase + dot", stacked: "4 · Stacked + squiggle", colours: "5 · Colour letters", wifi: "6 · Signal on the i (front page)" };
  for (const [k, fn] of Object.entries(TapArt.logos)) {
    for (const dark of [false, true]) {
      const c = document.createElement("div");
      c.className = "logo-card" + (dark ? " dark" : "");
      c.innerHTML = fn() + '<span class="tag">' + lnames[k] + (dark ? " · on dark" : "") + "</span>";
      document.getElementById("logos").append(c);
    }
  }
  const layouts = ["1 · Split: form left, art right", "2 · Split mirrored, logo on the art", "3 · Banner on top", "4 · Card on the art", "5 · Logo first, one column"];
  layouts.forEach((label, i) => {
    const d = document.createElement("div");
    d.className = "page";
    d.innerHTML = '<div class="frame"><iframe loading="lazy" tabindex="-1" title="' + label + '" src="../login.html?layout=' + (i + 1) + '"></iframe></div><a href="../login.html?layout=' + (i + 1) + '">' + label + ' →</a>';
    document.getElementById("pages").append(d);
  });
  const fit = () => document.querySelectorAll(".page").forEach((p) => {
    const f = p.querySelector("iframe");
    f.style.transform = "scale(" + p.clientWidth / 1440 + ")";
  });
  addEventListener("resize", fit);
  fit();
</script>
</body>
</html>
